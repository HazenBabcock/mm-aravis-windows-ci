name: Aravis for 3rdpartypublic

# Builds Aravis and lays it out the way Micro-Manager's 3rdpartypublic holds
# it. This only needs to run when something that goes into that build
# changes. The adapter workflow does not use these artifacts directly; it
# uses a release made from them by hand (see README.md).
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aravis.yml
      - scripts/arrange_3rdpartypublic.py
      - tests/smoke.cpp
      - triplets/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARAVIS_VERSION: '0.8.36'
  VCPKG_REF: '2026.07.29'  # vcpkg release whose aravis port is ARAVIS_VERSION
  VCPKG_TRIPLET: x64-windows-release  # defined in triplets/
  VCPKG_DISABLE_METRICS: '1'
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite

jobs:
  aravis:
    name: Aravis for 3rdpartypublic
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Check out vcpkg ${{ env.VCPKG_REF }}
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REF }}
          path: vcpkg

      - name: Bootstrap vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      # vcpkg checks each cached package against a hash of its inputs, so a
      # stale entry is rebuilt rather than reused. GitHub deletes cache
      # entries unused for 7 days.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg-cache
          key: vcpkg-${{ env.VCPKG_REF }}-${{ env.VCPKG_TRIPLET }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ env.VCPKG_REF }}-${{ env.VCPKG_TRIPLET }}-

      - name: Build Aravis with vcpkg
        id: build
        run: |
          New-Item -ItemType Directory -Force -Path vcpkg-cache | Out-Null
          $before = @(Get-ChildItem -Recurse -File vcpkg-cache).Count
          .\vcpkg\vcpkg.exe install "aravis:$env:VCPKG_TRIPLET" `
            --overlay-triplets=triplets `
            --host-triplet=$env:VCPKG_TRIPLET `
            --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $added = @(Get-ChildItem -Recurse -File vcpkg-cache).Count - $before
          Write-Output "vcpkg added $added package(s) to the binary cache"
          "added=$added" >> $env:GITHUB_OUTPUT

      # Saved straight after the build, so a failure in a later step does not
      # throw away a long GLib build, and only when something new was built.
      - name: Save vcpkg binary cache
        if: steps.build.outputs.added != '0'
        uses: actions/cache/save@v6
        with:
          path: vcpkg-cache
          key: vcpkg-${{ env.VCPKG_REF }}-${{ env.VCPKG_TRIPLET }}-${{ github.run_id }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Arrange the files for 3rdpartypublic
        run: |
          python -m pip install --disable-pip-version-check pefile==2024.8.26
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/arrange_3rdpartypublic.py `
            --installed vcpkg\installed `
            --triplet $env:VCPKG_TRIPLET `
            --aravis-version $env:ARAVIS_VERSION `
            --vcpkg-ref $env:VCPKG_REF `
            --vcpkg-commit (git -C vcpkg rev-parse HEAD) `
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" `
            --runner-image "$env:ImageOS $env:ImageVersion" `
            --out out\3rdpartypublic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Unzipped into 3rdpartypublic, this gives aravis\aravis-<version>-bin.
      - name: Upload 3rdpartypublic\aravis
        uses: actions/upload-artifact@v7
        with:
          name: 3rdpartypublic-aravis-${{ env.ARAVIS_VERSION }}
          path: out/3rdpartypublic
          if-no-files-found: error

      # arv-tool, arv-fake-gv-camera and the rest, with the DLLs they need.
      - name: Upload the Aravis tools
        uses: actions/upload-artifact@v7
        with:
          name: aravis-tools-${{ env.ARAVIS_VERSION }}
          path: vcpkg/installed/${{ env.VCPKG_TRIPLET }}/tools/aravis
          if-no-files-found: error

      - name: Set up MSVC
        uses: compnerd/gha-setup-vsdevenv@452f99effa381b81c025ccfbdccaca509bff1b29 # v7
        with:
          toolset_version: '14.4'  # VS2022 (v143), as micromanager.sln uses

      - name: Smoke test using only the arranged files
        run: |
          $dir = "out\3rdpartypublic\aravis\aravis-$env:ARAVIS_VERSION-bin"
          cl /nologo /EHsc /std:c++17 /W3 /MD `
            /I "$dir\include\aravis-0.8" /I "$dir\include\glib-2.0" `
            tests\smoke.cpp /Fe:smoke.exe `
            /link /LIBPATH:"$dir\x64" aravis-0.8.lib gio-2.0.lib gobject-2.0.lib glib-2.0.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # With only the arranged DLLs and Windows on the search path, a DLL
          # missing from the arrangement stops the program from starting.
          $env:PATH = "$PWD\$dir\x64;$env:SystemRoot\System32;$env:SystemRoot"
          .\smoke.exe
          if ($LASTEXITCODE -eq -1073741515) {
            Write-Output "::error::smoke.exe could not start: a DLL it needs is missing from $dir\x64"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload vcpkg build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-logs
          path: vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
