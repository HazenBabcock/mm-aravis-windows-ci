name: Aravis for 3rdpartypublic

# Builds Aravis and its dependencies as static libraries and lays them out
# the way Micro-Manager's 3rdpartypublic holds them. This only needs to run
# when something that goes into that build changes. The adapter workflow does
# not use these artifacts directly; it uses a release made from them by hand
# (see README.md).
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aravis.yml
      - license-overrides/**
      - scripts/arrange_3rdpartypublic.py
      - tests/check_imports.py
      - tests/smoke.cpp
      - triplets/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARAVIS_VERSION: '0.8.36'
  VCPKG_REF: '2026.07.29'  # vcpkg release whose aravis port is ARAVIS_VERSION
  # Both defined in triplets/. The libraries are static; the tools vcpkg runs
  # during the build (GLib's resource compiler and so on) can stay DLLs.
  VCPKG_TRIPLET: x64-windows-static-md-release
  VCPKG_HOST_TRIPLET: x64-windows-release
  # The toolset the static triplet pins. The arrange step checks that every
  # object in the libraries came from the compiler this workflow links with.
  MSVC_TOOLSET: v143 (MSVC 14.44)
  VCPKG_DISABLE_METRICS: '1'
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite

jobs:
  aravis:
    name: Aravis for 3rdpartypublic
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Check out vcpkg ${{ env.VCPKG_REF }}
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REF }}
          path: vcpkg

      - name: Bootstrap vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      # vcpkg checks each cached package against a hash of its inputs, so a
      # stale entry is rebuilt rather than reused. GitHub deletes cache
      # entries unused for 7 days.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg-cache
          key: vcpkg-${{ env.VCPKG_REF }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ env.VCPKG_REF }}-

      # Source archives and build tools. Only needed when something has to be
      # built, but then it spares a slow download (GNU's mirror has timed out
      # for minutes at a time).
      - name: Restore vcpkg downloads
        uses: actions/cache/restore@v6
        with:
          path: vcpkg/downloads
          key: vcpkg-downloads-${{ env.VCPKG_REF }}-${{ github.run_id }}
          restore-keys: vcpkg-downloads-${{ env.VCPKG_REF }}-

      - name: Build Aravis with vcpkg
        id: build
        run: |
          New-Item -ItemType Directory -Force -Path vcpkg-cache, vcpkg\downloads | Out-Null
          $packages = @(Get-ChildItem -Recurse -File vcpkg-cache).Count
          $downloads = @(Get-ChildItem -Recurse -File vcpkg\downloads).Count
          .\vcpkg\vcpkg.exe install "aravis:$env:VCPKG_TRIPLET" `
            --overlay-triplets=triplets `
            --host-triplet=$env:VCPKG_HOST_TRIPLET `
            --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem -Recurse -File vcpkg-cache).Count - $packages
          $downloads = @(Get-ChildItem -Recurse -File vcpkg\downloads).Count - $downloads
          Write-Output "vcpkg added $packages package(s) to the binary cache and downloaded $downloads file(s)"
          "packages=$packages" >> $env:GITHUB_OUTPUT
          "downloads=$downloads" >> $env:GITHUB_OUTPUT

      # Saved straight after the build, so a failure in a later step does not
      # throw away a long build, and only when there is something new.
      - name: Save vcpkg binary cache
        if: steps.build.outputs.packages != '0'
        uses: actions/cache/save@v6
        with:
          path: vcpkg-cache
          key: vcpkg-${{ env.VCPKG_REF }}-${{ github.run_id }}

      - name: Save vcpkg downloads
        if: steps.build.outputs.downloads != '0'
        uses: actions/cache/save@v6
        with:
          path: vcpkg/downloads
          key: vcpkg-downloads-${{ env.VCPKG_REF }}-${{ github.run_id }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up MSVC
        uses: compnerd/gha-setup-vsdevenv@452f99effa381b81c025ccfbdccaca509bff1b29 # v7
        with:
          toolset_version: '14.4'  # VS2022 (v143), as micromanager.sln uses

      - name: Arrange the files for 3rdpartypublic
        run: |
          python -m pip install --disable-pip-version-check pefile==2024.8.26
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pkgconf = Get-ChildItem -Recurse -File -Filter pkgconf.exe "vcpkg\installed\$env:VCPKG_HOST_TRIPLET" |
            Select-Object -First 1
          if (-not $pkgconf) { Write-Output "::error::vcpkg did not build pkgconf.exe"; exit 1 }
          # An object from the compiler that will link the libraries, for
          # the script to compare their compiler stamps against.
          Set-Content -Path out-probe.c -Value 'int probe;'
          cl /nologo /c out-probe.c /Fo:out-probe.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/arrange_3rdpartypublic.py `
            --installed vcpkg\installed `
            --triplet $env:VCPKG_TRIPLET `
            --pkgconf $pkgconf.FullName `
            --aravis-version $env:ARAVIS_VERSION `
            --vcpkg-ref $env:VCPKG_REF `
            --vcpkg-commit (git -C vcpkg rev-parse HEAD) `
            --repo-url "${{ github.server_url }}/${{ github.repository }}" `
            --repo-commit $env:GITHUB_SHA `
            --toolset $env:MSVC_TOOLSET `
            --compiler-probe out-probe.obj `
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" `
            --runner-image "$env:ImageOS $env:ImageVersion" `
            --out out\3rdpartypublic `
            --link-list out\link-libraries.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Unzipped into 3rdpartypublic, this gives Aravis\aravis-<version>-bin.
      - name: Upload 3rdpartypublic\Aravis
        uses: actions/upload-artifact@v7
        with:
          name: 3rdpartypublic-Aravis-${{ env.ARAVIS_VERSION }}
          path: out/3rdpartypublic
          if-no-files-found: error

      # arv-tool, arv-fake-gv-camera and the rest, statically linked like the
      # libraries, with the same licenses and build record. Static linking
      # drops Aravis's built-in fake-camera description from the tools, so
      # arv-fake-camera.xml from the same Aravis release comes along, for
      # arv-fake-gv-camera's -g option.
      - name: Collect the Aravis tools
        run: |
          $dir = "out\3rdpartypublic\Aravis\aravis-$env:ARAVIS_VERSION-bin"
          New-Item -ItemType Directory -Force -Path out\tools | Out-Null
          Copy-Item "vcpkg\installed\$env:VCPKG_TRIPLET\tools\aravis\*" out\tools
          Copy-Item -Recurse "$dir\licenses" out\tools
          Copy-Item "$dir\BUILD-INFO.txt" out\tools
          Invoke-WebRequest -OutFile out\tools\arv-fake-camera.xml `
            "https://raw.githubusercontent.com/AravisProject/aravis/$env:ARAVIS_VERSION/src/arv-fake-camera.xml"
          python tests/check_imports.py (Get-ChildItem out\tools\*.exe).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the Aravis tools
        uses: actions/upload-artifact@v7
        with:
          name: aravis-tools-${{ env.ARAVIS_VERSION }}
          path: out/tools
          if-no-files-found: error

      # Serves the fake GigE camera on loopback with that description, as the
      # adapter tests do, and reads its width back with arv-tool.
      - name: Check the fake GigE camera
        run: |
          $fake = Start-Process -PassThru -NoNewWindow `
            -FilePath out\tools\arv-fake-gv-camera-0.8.exe `
            -ArgumentList '-i', '127.0.0.1', '-s', 'GV01', '-g', "$PWD\out\tools\arv-fake-camera.xml"
          Start-Sleep -Seconds 3
          & out\tools\arv-tool-0.8.exe
          $width = & out\tools\arv-tool-0.8.exe -n Aravis-Fake-GV01 control Width
          $result = $LASTEXITCODE
          Write-Output $width
          Stop-Process -Id $fake.Id -Force
          if ($result -ne 0 -or -not ($width -match '^Width = 512')) {
            Write-Output "::error::arv-tool could not read the fake GigE camera's width"
            exit 1
          }

      # Links the way the adapter's project will: the arranged libraries plus
      # Visual Studio's default Windows libraries. /INCLUDE keeps the object
      # that registers Aravis's built-in fake-camera description, which the
      # linker would otherwise drop because nothing calls it by name. Then
      # checks that the program loads nothing but Windows DLLs, and runs it
      # with only System32 on the search path.
      - name: Smoke test using only the arranged files
        run: |
          $dir = "out\3rdpartypublic\Aravis\aravis-$env:ARAVIS_VERSION-bin"
          $libraries = Get-Content out\link-libraries.txt
          cl /nologo /EHsc /std:c++17 /W3 /MD `
            /I "$dir\include\aravis-0.8" /I "$dir\include\glib-2.0" `
            tests\smoke.cpp /Fe:smoke.exe `
            /link /LIBPATH:"$dir\x64" $libraries `
            kernel32.lib user32.lib advapi32.lib shell32.lib ole32.lib uuid.lib `
            /INCLUDE:arvresources_get_resource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/check_imports.py smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          .\smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload vcpkg build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-logs
          path: vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
