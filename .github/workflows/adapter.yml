name: Aravis adapter

# Builds the Micro-Manager Aravis adapter against a published release of the
# Aravis files, as Micro-Manager's own build uses a fixed 3rdpartypublic, and
# loads it with pymmcore. No Aravis build happens here.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/adapter.yml
      - tests/check_imports.py
      - tests/load_adapter.py
  workflow_dispatch:
    inputs:
      repository:
        description: mmCoreAndDevices repository to build the adapter from
        default: HazenBabcock/mmCoreAndDevices
      ref:
        description: Branch, tag or commit in that repository
        default: aravis-windows

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARAVIS_RELEASE: aravis-0.8.36-3  # release of this repository with the Aravis files
  ARAVIS_VERSION: '0.8.36'
  MMCOREANDDEVICES_REPO: ${{ inputs.repository || 'HazenBabcock/mmCoreAndDevices' }}
  MMCOREANDDEVICES_REF: ${{ inputs.ref || 'aravis-windows' }}
  PYMMCORE_VERSION: '12.5.0.75.0'  # device interface 75, as in MMCOREANDDEVICES_REF

jobs:
  adapter:
    name: Aravis adapter
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # micromanager.sln finds 3rdpartypublic two levels above
      # mmCoreAndDevices, beside the micro-manager directory.
      - name: Check out ${{ env.MMCOREANDDEVICES_REPO }} ${{ env.MMCOREANDDEVICES_REF }}
        uses: actions/checkout@v7
        with:
          repository: ${{ env.MMCOREANDDEVICES_REPO }}
          ref: ${{ env.MMCOREANDDEVICES_REF }}
          path: micro-manager/mmCoreAndDevices

      - name: Download release ${{ env.ARAVIS_RELEASE }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:ARAVIS_RELEASE --repo $env:GITHUB_REPOSITORY --dir release
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Could not download release $env:ARAVIS_RELEASE of this repository. See 'Publishing the Aravis files' in README.md."
            exit 1
          }
          Expand-Archive "release\3rdpartypublic-Aravis-$env:ARAVIS_VERSION.zip" -DestinationPath 3rdpartypublic
          Expand-Archive "release\aravis-tools-$env:ARAVIS_VERSION.zip" -DestinationPath aravis-tools
          Get-Content "3rdpartypublic\Aravis\aravis-$env:ARAVIS_VERSION-bin\BUILD-INFO.txt"

      - name: Set up MSVC
        uses: compnerd/gha-setup-vsdevenv@452f99effa381b81c025ccfbdccaca509bff1b29 # v7
        with:
          toolset_version: '14.4'  # VS2022 (v143), as micromanager.sln uses

      - name: Build the adapter
        run: |
          msbuild micro-manager\mmCoreAndDevices\micromanager.sln `
            /t:AravisCamera /p:Configuration=Release /p:Platform=x64 `
            /m /nologo /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Aravis is linked statically, so the adapter is all a Micro-Manager
      # installation needs; the check fails if it loads any DLL that is not
      # part of Windows or the Visual C++ runtime.
      - name: Stage the adapter and check its imports
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item micro-manager\mmCoreAndDevices\build\Release\x64\mmgr_dal_AravisCamera.dll stage
          python -m pip install --disable-pip-version-check pefile==2024.8.26 pymmcore==$env:PYMMCORE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/check_imports.py stage\mmgr_dal_AravisCamera.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the adapter
        uses: actions/upload-artifact@v7
        with:
          name: mmgr_dal_AravisCamera
          path: stage
          if-no-files-found: error

      - name: Load the adapter with pymmcore
        run: |
          python tests/load_adapter.py stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Aravis discovers a GigE camera served on the loopback interface, so
      # this takes the adapter through discovery, opening the camera and a
      # snap without any hardware. The tools are statically linked, so the
      # fake camera takes its GenICam description from the file in the
      # tools release rather than from Aravis's built-in copy.
      - name: Snap from Aravis's fake GigE camera
        run: |
          $fake = Start-Process -PassThru -NoNewWindow `
            -FilePath aravis-tools\arv-fake-gv-camera-0.8.exe `
            -ArgumentList '-i', '127.0.0.1', '-s', 'GV01', '-g', "$PWD\aravis-tools\arv-fake-camera.xml"
          Start-Sleep -Seconds 3
          python tests/load_adapter.py stage --snap Fake
          $result = $LASTEXITCODE
          Stop-Process -Id $fake.Id -Force
          exit $result
